name: CI Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Full Test & Typecheck Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taysr_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/taysr_erp_test

      - name: Push Database Schema
        run: npx prisma db push --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/taysr_erp_test

      - name: Run Full Master Verification Suite
        run: npm run test:full
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/taysr_erp_test
          JWT_SECRET: ci-test-secret-key-1234567890
          PLATFORM_PROVISIONING_SECRET: ci-platform-secret-12345
