name: CI

on:
  push:
    branches: [ main, dev, master ]
  pull_request:
    branches: [ main, dev, master ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: taysrpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backend TypeScript Check
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Frontend TypeScript Check
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Build Frontend
        run: npx vite build frontend

      - name: Apply Database Schema & Run Tenant Isolation Smoke Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/taysrpos_test?schema=public"
          JWT_SECRET: "taysr-pos-ci-test-secret-minimum-32-characters-long"
          NODE_ENV: "test"
        run: |
          npx prisma db push --schema backend/prisma/schema.prisma
          npx tsx backend/scripts/tenant-isolation-smoke.ts
