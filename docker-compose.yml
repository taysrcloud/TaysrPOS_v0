name: taysrpos

services:
  # ── DB Service (PostgreSQL) ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: taysrpos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-taysrpos_v0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taysrpos_v0}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taysrpos_network

  # ── API Service (Backend Express API) ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taysrpos_api
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4400
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-taysrpos_v0}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-taysr-pos-production-secret-key-32-characters-minimum}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5400}
      TAYSRPOS_PROVISIONING_SECRET: ${TAYSRPOS_PROVISIONING_SECRET:-change-this-provisioning-secret}
    ports:
      - "4400:4400"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4400/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - taysrpos_network

  # ── WEB Service (Frontend Vite + Nginx) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: taysrpos_web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - taysrpos_network

volumes:
  postgres_data:
    driver: local

networks:
  taysrpos_network:
    driver: bridge
