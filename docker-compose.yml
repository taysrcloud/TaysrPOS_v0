name: taysrpos

services:
  # ── DB Service (PostgreSQL) ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-taysrpos_v0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taysrpos_v0}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taysrpos_network

  # ── API Service (Backend Express API) ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4400
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-taysrpos_v0}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-taysr-pos-production-secret-key-32-characters-minimum}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TAYSRPOS_PROVISIONING_SECRET: ${TAYSRPOS_PROVISIONING_SECRET:-change-this-provisioning-secret}
    expose:
      - "4400"
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4400/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - taysrpos_network
      - coolify

  # ── WEB Service (Frontend Vite + Nginx) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taysrpos-web-http.rule=Host(`pos.taysr.com`)"
      - "traefik.http.routers.taysrpos-web-http.entrypoints=http"
      - "traefik.http.routers.taysrpos-web-https.rule=Host(`pos.taysr.com`)"
      - "traefik.http.routers.taysrpos-web-https.entrypoints=https"
      - "traefik.http.routers.taysrpos-web-https.tls=true"
      - "traefik.http.services.taysrpos-web.loadbalancer.server.port=80"
    networks:
      - taysrpos_network
      - coolify

volumes:
  postgres_data:
    driver: local

networks:
  taysrpos_network:
    driver: bridge
  coolify:
    name: coolify
    external: true
